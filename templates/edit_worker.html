<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redaguoti {{ worker.name }} | Workforce Scheduler</title>
    <style>
        :root { --bg:#f5f5f5; --panel:#fff; --text:#222; --muted:#666; --border:#ddd; --ok:#067647; --accent:#222; }
        body[data-theme="dark"] { --bg:#101514; --panel:#17201e; --text:#eef4f2; --muted:#9fb0aa; --border:#2a3935; --accent:#eef4f2; }
        * { box-sizing:border-box; }
        body { font-family:"Segoe UI",Arial,sans-serif; max-width:980px; margin:32px auto; padding:20px; background:var(--bg); color:var(--text); }
        h1 { margin:0 0 6px; }
        .subtitle { color:var(--muted); margin:0 0 24px; }
        .tabs { display:flex; flex-wrap:wrap; gap:10px; margin-bottom:24px; }
        .tab-link { display:inline-block; text-decoration:none; padding:10px 14px; border-radius:999px; background:#e9e9e9; color:#222; font-weight:600; }
        .tab-link.active { background:#222; color:#fff; }
        .tool { background:var(--panel); padding:24px; border:1px solid var(--border); border-radius:12px; box-shadow:0 2px 12px rgba(0,0,0,.08); }
        form { display:grid; gap:14px; }
        label { font-weight:700; }
        input, select, textarea, button { width:100%; padding:12px; font:inherit; border-radius:8px; border:1px solid var(--border); background:var(--panel); color:var(--text); }
        textarea { min-height:420px; resize:vertical; font-family:"Cascadia Mono",Consolas,monospace; line-height:1.45; }
        .hint { color:var(--muted); font-size:14px; line-height:1.5; }
        .actions { display:flex; flex-wrap:wrap; gap:10px; }
        button, .cancel { width:auto; border:0; cursor:pointer; padding:12px 18px; font-weight:700; text-decoration:none; border-radius:8px; }
        button { background:var(--ok); color:#fff; }
        .cancel { background:#e9e9e9; color:#222; }
        .footer { margin-top:18px; color:var(--muted); font-size:13px; text-align:right; }
        @media (max-width:640px) { body { margin:0 auto; padding:16px; } .tool { padding:18px; } textarea { min-height:360px; } }
    </style>
</head>
<body>
    <h1>Redaguoti darbuotoja</h1>
    <p class="subtitle">{{ current_location.name }} · {{ expected_days }} kalendorines dienos</p>

    <nav class="tabs" aria-label="Lokacijos">
        {% for location in locations %}
            <a class="tab-link {% if location.active %}active{% endif %}" href="{{ url_for('home', location=location.id) }}">{{ location.name }}</a>
        {% endfor %}
    </nav>

    <main class="tool">
        <form action="{{ url_for('update_worker', worker_id=worker.id) }}" method="POST">
            <input type="hidden" name="location_id" value="{{ current_location_id }}">

            <label for="name">Vardas</label>
            <input id="name" name="name" value="{{ worker.name }}" required>

            <label for="etatas">Etatas</label>
            <select id="etatas" name="etatas" required>
                {% for value in ["0.25", "0.5", "0.75", "1.0"] %}
                    <option value="{{ value }}" {% if worker.etatas == value %}selected{% endif %}>{{ value }}</option>
                {% endfor %}
            </select>

            <label for="availability">Menesio galimumas</label>
            <div class="hint">Viena eilute = viena kalendorine diena. Vidines tuscios eilutes issaugomos ir nepastumia velesniu dienu.</div>
            <textarea id="availability" name="availability" spellcheck="false"></textarea>

            <div class="actions">
                <button type="submit">Issaugoti pakeitimus</button>
                <a class="cancel" href="{{ url_for('home', location=current_location_id, _anchor='workers') }}">Atsaukti</a>
            </div>
        </form>
    </main>
    <div class="footer">Build {{ build_number }}</div>

    <script>
        document.getElementById("availability").value = {{ worker.availability_raw | tojson }};
        const storedTheme = localStorage.getItem("theme");
        if (storedTheme) document.body.setAttribute("data-theme", storedTheme);
    </script>
</body>
</html>
